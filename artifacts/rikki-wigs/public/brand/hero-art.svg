<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">Rikki Wigs signature hair design</title>
  <desc id="desc">An elegant abstract composition of flowing bronze hair on a deep black background</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080706"/>
      <stop offset=".56" stop-color="#17120e"/>
      <stop offset="1" stop-color="#0b0907"/>
    </linearGradient>
    <linearGradient id="gold" x1=".1" y1=".1" x2=".9" y2=".9">
      <stop stop-color="#6e4727"/>
      <stop offset=".34" stop-color="#d0a56e"/>
      <stop offset=".58" stop-color="#8f6037"/>
      <stop offset=".82" stop-color="#e0ba82"/>
      <stop offset="1" stop-color="#5c3a22"/>
