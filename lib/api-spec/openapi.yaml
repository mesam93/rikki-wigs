openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: appointments
    description: Appointment booking and management
  - name: site-content
    description: Public testimonials and gallery content
  - name: services
    description: Public services and admin service management
  - name: orders
    description: Private wig orders and receipts
paths:
  /admin/orders:
    get:
      operationId: listWigOrders
      tags: [orders]
      summary: List private wig orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WigOrder" }
    post:
      operationId: createWigOrder
      tags: [orders]
      summary: Create a wig order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WigOrderInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WigOrder" }
  /admin/orders/{id}:
    patch:
      operationId: updateWigOrder
      tags: [orders]
      summary: Update an order or payment total
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WigOrderInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WigOrder" }
  /admin/orders/{id}/receipts:
    get:
      operationId: listWigReceipts
      tags: [orders]
      summary: List previously issued receipt snapshots
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Receipts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WigReceipt" }
    post:
      operationId: issueWigReceipt
      tags: [orders]
      summary: Issue a receipt from the saved order
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WigReceipt" }
  /admin/orders/{id}/receipts/{receiptId}/pdf:
    get:
      operationId: downloadWigReceipt
      tags: [orders]
      summary: Download protected receipt PDF
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: receiptId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /admin/orders/{id}/receipts/{receiptId}/view:
    get:
      operationId: viewWigReceipt
      tags: [orders]
      summary: View protected receipt PDF in the browser
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: receiptId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Inline PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/AppointmentStatus"
      responses:
        "200":
          description: Appointment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Request an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Appointment requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update an appointment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Appointment not found
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Delete an appointment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Appointment deleted
        "404":
          description: Appointment not found
  /appointments/summary:
    get:
      operationId: getAppointmentSummary
      tags: [appointments]
      summary: Get appointment totals by status
      responses:
        "200":
          description: Appointment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentSummary"
  /email-status:
    get:
      operationId: getEmailStatus
      tags: [appointments]
      summary: Get appointment email delivery status
      responses:
        "200":
          description: Email delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDeliveryStatus"
  /availability:
    get:
      operationId: getAvailability
      tags: [appointments]
      summary: Get available booking dates and times
      parameters:
        - in: query
          name: service
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Available dates and times
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityDay"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List active public and bookable services
      responses:
        "200":
          description: Active services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
  /services/images/{id}:
    get:
      operationId: getServiceImage
      tags: [services]
      summary: Get an uploaded service image
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Service image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Service image not found
  /admin/services:
    get:
      operationId: listAdminServices
      tags: [services]
      summary: List all services for the admin
      responses:
        "200":
          description: All services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Create a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /admin/services/upload-url:
    post:
      operationId: requestServiceUploadUrl
      tags: [services]
      summary: Request a protected service image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUploadRequest"
      responses:
        "200":
          description: Upload details
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, objectPath]
                properties:
                  uploadUrl: { type: string, format: uri }
                  objectPath: { type: string }
  /admin/services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          description: Service not found
    delete:
      operationId: archiveService
      tags: [services]
      summary: Archive a service
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Service archived
        "404":
          description: Service not found
  /testimonials:
    get:
      operationId: listTestimonials
      tags: [site-content]
      summary: List published testimonials
      responses:
        "200":
          description: Published testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
  /admin/testimonials:
    get:
      operationId: listAdminTestimonials
      tags: [site-content]
      summary: List testimonials for the admin
      responses:
        "200":
          description: All testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Testimonial"
    post:
      operationId: createTestimonial
      tags: [site-content]
      summary: Add a testimonial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialInput"
      responses:
        "201":
          description: Testimonial created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"
  /admin/testimonials/{id}:
    patch:
      operationId: updateTestimonial
      tags: [site-content]
      summary: Update a testimonial
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestimonialInput"
      responses:
        "200":
          description: Testimonial updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Testimonial"
    delete:
      operationId: deleteTestimonial
      tags: [site-content]
      summary: Remove a testimonial
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Testimonial removed
  /gallery:
    get:
      operationId: listGalleryPhotos
      tags: [site-content]
      summary: List published gallery photos
      responses:
        "200":
          description: Gallery photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPhoto"
  /admin/gallery:
    get:
      operationId: listAdminGalleryPhotos
      tags: [site-content]
      summary: List gallery photos for the admin
      responses:
        "200":
          description: All gallery photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryPhoto"
    post:
      operationId: createGalleryPhoto
      tags: [site-content]
      summary: Add an uploaded photo to the gallery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryPhotoInput"
      responses:
        "201":
          description: Gallery photo created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryPhoto"
  /admin/gallery/upload-url:
    post:
      operationId: requestGalleryUploadUrl
      tags: [site-content]
      summary: Request a protected gallery image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GalleryUploadRequest"
      responses:
        "200":
          description: Upload details
          content:
            application/json:
              schema:
                type: object
                required: [uploadUrl, objectPath]
                properties:
                  uploadUrl: { type: string, format: uri }
                  objectPath: { type: string }
  /admin/gallery/{id}:
    delete:
      operationId: deleteGalleryPhoto
      tags: [site-content]
      summary: Remove a gallery photo
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Gallery photo removed
components:
  schemas:
    WigOrderInput:
      type: object
      additionalProperties: false
      required: [kind, itemCode, orderDate, customerName, priceCents, taxRateMilliPercent, amountPaidCents]
      properties:
        kind: { type: string, enum: [stock, custom] }
        itemCode: { type: string, minLength: 1, maxLength: 100 }
        orderDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        customerName: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 3000 }
        style: { type: string, maxLength: 200 }
        capSize: { type: string, maxLength: 200 }
        lengthInch: { type: string, maxLength: 200 }
        hairType: { type: string, maxLength: 200 }
        part: { type: string, maxLength: 200 }
        layers: { type: string, maxLength: 200 }
        density: { type: string, maxLength: 200 }
        color: { type: string, maxLength: 200 }
        highlights: { type: string, maxLength: 500 }
        priceCents: { type: integer, minimum: 0 }
        taxRateMilliPercent: { type: integer, minimum: 0, maximum: 100000 }
        amountPaidCents: { type: integer, minimum: 0 }
    WigOrder:
      type: object
      required: [id, kind, itemCode, orderDate, customerName, phone, email, notes, style, capSize, lengthInch, hairType, part, layers, density, color, highlights, priceCents, taxRateMilliPercent, amountPaidCents, taxCents, totalCents, amountDueCents, needsReview, reviewIssues, sourceSheet, sourceRowNumber, sourceValues, createdAt]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [stock, custom] }
        itemCode: { type: string, nullable: true }
        orderDate: { type: string, nullable: true }
        customerName: { type: string, nullable: true }
        phone: { type: string }
        email: { type: string }
        notes: { type: string }
        style: { type: string }
        capSize: { type: string }
        lengthInch: { type: string }
        hairType: { type: string }
        part: { type: string }
        layers: { type: string }
        density: { type: string }
        color: { type: string }
        highlights: { type: string }
        priceCents: { type: integer, nullable: true }
        taxRateMilliPercent: { type: integer }
        amountPaidCents: { type: integer, nullable: true }
        taxCents: { type: integer, nullable: true }
        totalCents: { type: integer, nullable: true }
        amountDueCents: { type: integer, nullable: true }
        needsReview: { type: boolean }
        reviewIssues:
          type: array
          items: { type: string }
        sourceSheet: { type: string, nullable: true }
        sourceRowNumber: { type: integer, nullable: true }
        sourceValues:
          type: object
          nullable: true
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }
    WigReceipt:
      type: object
      required: [id, orderId, issuedAt, receiptNumber, customerName, itemCode]
      properties:
        id: { type: integer }
        orderId: { type: integer }
        issuedAt: { type: string, format: date-time }
        receiptNumber: { type: string }
        customerName: { type: string, nullable: true }
        itemCode: { type: string, nullable: true }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AppointmentStatus:
      type: string
      enum: [pending, confirmed, completed, cancelled]
    EmailDeliveryStatus:
      type: object
      required: [mode, configured, label]
      properties:
        mode:
          type: string
          enum: [disabled, test, smtp]
        configured:
          type: boolean
        label:
          type: string
    Appointment:
      type: object
      required: [id, name, phone, email, service, appointmentDate, appointmentTime, status, notes, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        service:
          type: string
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
    AppointmentInput:
      type: object
      required: [name, phone, email, service, appointmentDate, appointmentTime]
      properties:
        name:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 7
        email:
          type: string
          format: email
        service:
          type: string
          minLength: 2
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
          minLength: 3
        notes:
          type: string
          default: ""
    AppointmentUpdate:
      type: object
      properties:
        appointmentDate:
          type: string
          format: date
        appointmentTime:
          type: string
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        notes:
          type: string
    AppointmentSummary:
      type: object
      required: [total, pending, confirmed, completed, cancelled, upcoming]
      properties:
        total:
          type: integer
        pending:
          type: integer
        confirmed:
          type: integer
        completed:
          type: integer
        cancelled:
          type: integer
        upcoming:
          type: integer
    AvailabilityDay:
      type: object
      required: [date, times]
      properties:
        date:
          type: string
          format: date
        times:
          type: array
          items:
            type: string
    TimeWindow:
      type: object
      required: [id, start, end]
      properties:
        id: { type: string }
        start: { type: string }
        end: { type: string }
    ServiceWeeklyHours:
      type: object
      required: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
      properties:
        sunday:
          type: array
          items: { $ref: "#/components/schemas/TimeWindow" }
        monday:
          type: array
          items: { $ref: "#/components/schemas/TimeWindow" }
        tuesday:
          type: array
          items: { $ref: "#/components/schemas/TimeWindow" }
        wednesday:
          type: array
          items: { $ref: "#/components/schemas/TimeWindow" }
        thursday:
          type: array
          items: { $ref: "#/components/schemas/TimeWindow" }
        friday:
          type: array
          items: { $ref: "#/components/schemas/TimeWindow" }
        saturday:
          type: array
          items: { $ref: "#/components/schemas/TimeWindow" }
    Service:
      type: object
      required: [id, name, imagePath, imageUrl, altText, sortOrder, isVisible, isBookable, isArchived, durationMinutes, weeklyHours, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        imagePath: { type: string }
        imageUrl: { type: string }
        altText: { type: string }
        sortOrder: { type: integer }
        isVisible: { type: boolean }
        isBookable: { type: boolean }
        isArchived: { type: boolean }
        durationMinutes: { type: integer }
        weeklyHours:
          $ref: "#/components/schemas/ServiceWeeklyHours"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ServiceInput:
      type: object
      required: [name, imagePath, altText, sortOrder, isVisible, isBookable, durationMinutes, weeklyHours]
      properties:
        name: { type: string, minLength: 1 }
        imagePath: { type: string }
        altText: { type: string }
        sortOrder: { type: integer, minimum: 0 }
        isVisible: { type: boolean }
        isBookable: { type: boolean }
        durationMinutes: { type: integer, minimum: 15, maximum: 480 }
        weeklyHours:
          $ref: "#/components/schemas/ServiceWeeklyHours"
    ServiceUploadRequest:
      type: object
      required: [contentType]
      properties:
        contentType: { type: string }
    Testimonial:
      type: object
      required: [id, author, quote, isPublished, sortOrder, createdAt]
      properties:
        id: { type: integer }
        author: { type: string }
        quote: { type: string }
        isPublished: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
    TestimonialInput:
      type: object
      required: [author, quote]
      properties:
        author: { type: string, minLength: 1 }
        quote: { type: string, minLength: 1 }
        isPublished: { type: boolean, default: true }
    GalleryPhoto:
      type: object
      required: [id, objectPath, imageUrl, altText, caption, isPublished, sortOrder, createdAt]
      properties:
        id: { type: integer }
        objectPath: { type: string }
        imageUrl: { type: string }
        altText: { type: string }
        caption: { type: string }
        isPublished: { type: boolean }
        sortOrder: { type: integer }
        createdAt: { type: string, format: date-time }
    GalleryPhotoInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string }
        altText: { type: string }
        caption: { type: string }
    GalleryUploadRequest:
      type: object
      required: [contentType]
      properties:
        contentType: { type: string }

